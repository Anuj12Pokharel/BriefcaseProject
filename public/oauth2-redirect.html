<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OAuth2 Redirect</title>
  </head>
  <body>
    <script>
      try {
        // Send the full hash (e.g. #access_token=...&token_type=Bearer&...) to the opener window
        if (window.opener && window.location.hash) {
          window.opener.postMessage(window.location.hash, window.location.origin);
        }
      } catch (e) {
        // ignore
      }
      // Close the popup
      window.close();
    </script>
    <div style="font-family: system-ui, sans-serif; padding: 20px;">Redirecting...</div>
  </body>
</html>
